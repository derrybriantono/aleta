<!doctype html>
<meta charset="utf-8">
<title>ALETA untuk SIPP</title>
<style>
  /*
   * Popup ekstensi.
   *
   * Warnanya mengikuti tema peramban. Popup yang selalu putih menyilaukan
   * pada Chrome bertema gelap, dan itu terasa setiap kali saklarnya dibuka.
   */
  :root {
    --latar: #ffffff;
    --latar-lembut: #f4f7f5;
    --tulisan: #14201b;
    --tulisan-lembut: #5b6b62;
    --garis: #dbe4de;
    --merek: #155375;
    --sorot: #e8f0f4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --latar: #141b19;
      --latar-lembut: #1b2521;
      --tulisan: #e6ede9;
      --tulisan-lembut: #9aaaa1;
      --garis: #2b3833;
      --merek: #7cc0e4;
      --sorot: #1e2c33;
    }
  }

  * { box-sizing: border-box; }

  body {
    width: 300px;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    color: var(--tulisan);
    background: var(--latar);
  }

  /* --- Kepala dengan logo --- */
  .kepala {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--latar-lembut);
    border-bottom: 1px solid var(--garis);
  }

  .kepala img { width: 34px; height: 34px; flex: none; object-fit: contain; }

  .judul { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; margin: 0; }
  .anak-judul { margin: 1px 0 0; font-size: 11px; color: var(--tulisan-lembut); }

  .isi { padding: 14px 16px 16px; }

  .pengantar { margin: 0 0 14px; font-size: 12px; color: var(--tulisan-lembut); }

  /* --- Saklar --- */
  .saklar {
    display: flex;
    /* Kotak centang sejajar BARIS JUDUL, bukan mengambang di tengah kartu.
       Tanpa ini, pada kartu berketerangan panjang ia turun jauh dari nama
       saklarnya dan tidak lagi terbaca sebagai pasangan. */
    align-items: flex-start;
    gap: 10px;
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid var(--garis);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }

  .saklar:hover { background: var(--latar-lembut); border-color: var(--merek); }

  .saklar input { margin: 2px 0 0; flex: none; accent-color: var(--merek); }

  .saklar-nama { font-weight: 600; display: block; }
  .saklar-ket { display: block; margin-top: 2px; font-size: 11px; color: var(--tulisan-lembut); }

  .kaki {
    margin-top: 14px;
    padding: 10px 16px;
    border-top: 1px solid var(--garis);
    color: var(--tulisan-lembut);
    font-size: 11px;
    background: var(--latar-lembut);
  }

  a { color: var(--merek); }
</style>

<div class="kepala">
  <img src="ikon/aleta-128.png" alt="Logo ALETA">
  <div>
    <p class="judul">ALETA UNTUK SIPP</p>
    <p class="anak-judul">Keterangan e-Court di halaman SIPP</p>
  </div>
</div>

<div class="isi">
  <p class="pengantar">
    Hanya menambah keterangan &mdash; tidak mengubah data dan tidak menekan tombol apa pun di
    SIPP. Mematikannya mengembalikan halaman seperti semula.
  </p>

  <label class="saklar">
    <input type="checkbox" id="aktif" checked>
    <span>
      <span class="saklar-nama">Nyalakan ALETA di SIPP</span>
      <span class="saklar-ket">
        Saklar induk. Panel melayang di sisi kanan halaman perkara.
        Bila dimatikan, panel maupun sisipan tidak muncul sama sekali.
      </span>
    </span>
  </label>

  <label class="saklar">
    <input type="checkbox" id="tandaiHalaman">
    <span>
      <span class="saklar-nama">Tandai halaman SIPP</span>
      <span class="saklar-ket">
        Menempelkan penanda ringkas di judul perkara dan di tiap baris daftar perkara.
      </span>
    </span>
  </label>

  <label class="saklar">
    <input type="checkbox" id="sisipJadwal">
    <span>
      <span class="saklar-nama">Sisipkan berkas ke Jadwal Sidang</span>
      <span class="saklar-ket">
        Menaruh berkas jawaban, replik, dan duplik di baris sidangnya. Dicocokkan hanya
        dengan tanggal sidang. <strong>Tidak pernah ikut tercetak</strong> pada relas.
      </span>
    </span>
  </label>
</div>

<div class="kaki">
  Perlu login <a id="tautanPortal" href="#" target="_blank" rel="noreferrer noopener">portal ALETA</a>
  lebih dulu. SIPP tidak diubah sama sekali.
</div>

<script src="popup.js"></script>
