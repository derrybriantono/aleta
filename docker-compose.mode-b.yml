version: "2.4"

services:
  reverse_proxy:
    container_name: aleta-reverse-proxy
    image: nginx:1.24-alpine
    restart: unless-stopped
    depends_on:
      - portal
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/aleta-container.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
