# Mode B: hanya gunakan jika port 80 belum dipakai web server host.

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    location = /aleta {
        proxy_pass http://portal:3000/aleta;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Login e-Court meluncurkan peramban di sisi bot: membuka halaman Mahkamah
        # Agung, menunggu jaringan tenang, lalu memotret captchanya. Itu kerap
        # melewati 60 detik - batas bawaan Nginx - dan yang terlihat petugas adalah
        # galat gateway, seolah ALETA yang rusak.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /aleta/ {
        proxy_pass http://portal:3000/aleta/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Login e-Court meluncurkan peramban di sisi bot: membuka halaman Mahkamah
        # Agung, menunggu jaringan tenang, lalu memotret captchanya. Itu kerap
        # melewati 60 detik - batas bawaan Nginx - dan yang terlihat petugas adalah
        # galat gateway, seolah ALETA yang rusak.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
