# Mode A: gunakan file ini jika Apache/httpd host sudah berjalan di port 80.
# File ini hanya mengambil path /aleta dan tidak mengganggu aplikasi lain di root.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "http"

# Login e-Court meluncurkan peramban di sisi bot: membuka halaman Mahkamah
# Agung, menunggu jaringan tenang, lalu memotret captchanya. Itu kerap melewati
# 60 detik - batas bawaan Apache di CentOS 7 - dan yang terlihat petugas adalah
# galat gateway, seolah ALETA yang rusak.
#
# Batasnya ditaruh pada ProxyPass, BUKAN sebagai ProxyTimeout global: server ini
# juga melayani SIPP, dan menaikkan batas seluruh proxy demi satu jalur bukan
# perubahan yang perlu.
ProxyPass /aleta http://127.0.0.1:3000/aleta timeout=120
ProxyPassReverse /aleta http://127.0.0.1:3000/aleta
