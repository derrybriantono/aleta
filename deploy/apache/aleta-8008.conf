# =============================================================================
# ALETA di port sendiri: http://192.168.10.10:8008/aleta  (K1, 19 Okt 2026)
# =============================================================================
#
# Pasang: salin ke /etc/httpd/conf.d/aleta-8008.conf, lalu
#   apachectl configtest && systemctl reload httpd
# dan buka firewall (dijalankan pengguna sendiri):
#   firewall-cmd --permanent --add-port=8008/tcp && firewall-cmd --reload
# Panduan lengkap dan cara mundur: docs/pasang/PORT-8008.md
#
# SEBABNYA: SIPP, ABT, dan ALETA sama-sama di http://192.168.10.10:80, dan
# peramban hanya membuka 6 sambungan per host:port (HTTP/1.1). Permintaan
# ALETA yang dijawab server dalam 3 ms terukur menunggu 26-56 detik di Chrome
# karena antre di belakang SIPP/ABT dan polling ekstensi. Port sendiri = enam
# sambungan sendiri untuk ALETA.
#
# Port 80 TETAP melayani /aleta seperti sekarang (aleta.conf tidak diubah).
# Kuki sesi tidak membedakan port, jadi sesi yang sama berlaku di keduanya.
#
# Isi di bawah menyalin aturan yang berlaku di port 80:
#   aleta.conf               - proxy /aleta ke portal 127.0.0.1:3000
#   000-aleta-prefix-fix.conf - /aleta/aleta/* dan logo MA tidak diproksikan
#   000-aleta-uploads.conf    - /aleta/uploads/ dilayani langsung dari disk
#   aleta-logo-redirect.conf  - logo MA
# Alias /aleta/uploads/, <Directory> uploads, dan RedirectMatch di berkas-berkas
# itu berada di konteks server utama dan ikut berlaku di VirtualHost ini;
# ProxyPass TIDAK diwarisi (ProxyPassInherit Off) supaya urutannya pasti.
# =============================================================================

Listen 8008

<VirtualHost *:8008>
    ServerName 192.168.10.10:8008

    # Catatan permintaan ALETA tersendiri, DENGAN lama layanan (%D, mikrodetik)
    # - bahan mengukur performa tanpa menyentuh log port 80.
    LogFormat "%h %l %u %t \"%r\" %>s %b %D \"%{Referer}i\" \"%{User-Agent}i\"" aletadurasi
    CustomLog "logs/aleta8008_access_log" aletadurasi
    ErrorLog "logs/aleta8008_error_log"

    # Akar port ini langsung ke portal.
    RedirectMatch 302 ^/$ /aleta/

    ProxyPassInherit Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    # Port ikut, supaya alamat absolut yang disusun portal (mis. updates.xml
    # ekstensi) menunjuk ke port ini.
    RequestHeader set X-Forwarded-Host "192.168.10.10:8008"

    # Sama dengan 000-aleta-uploads.conf dan 000-aleta-prefix-fix.conf:
    # pengecualian HARUS sebelum ProxyPass /aleta.
    ProxyPass /aleta/uploads/ !
    ProxyPass /aleta/aleta/ !
    ProxyPass /aleta/aleta !
    ProxyPass /mahkamah-agung-logo.png !

    # Sama dengan aleta.conf.
    ProxyPass /aleta http://127.0.0.1:3000/aleta timeout=120
    ProxyPassReverse /aleta http://127.0.0.1:3000/aleta
</VirtualHost>

# -----------------------------------------------------------------------------
# OPSI (TIDAK AKTIF): pindahkan pengguna port 80 ke port 8008 otomatis.
# -----------------------------------------------------------------------------
# Hanya untuk HALAMAN portal. /aleta/api/, /aleta/_next/, dan /aleta/uploads/
# JANGAN dialihkan: ekstensi di halaman SIPP/ABT memanggil /aleta/api/...
# dengan alamat relatif (port 80), dan pengalihan lintas port pada fetch
# berkuki akan ditolak peramban (CORS). Aktifkan hanya sesudah firewall 8008
# terbuka dan diuji dari komputer petugas. Aturan di konteks server utama
# IKUT berlaku di VirtualHost 8008, jadi WAJIB dibatasi ke port 80 - tanpa <If>
# ini port 8008 mengalihkan ke dirinya sendiri tanpa henti. Hapus tanda #
# pada ketiga baris:
#
# <If "%{SERVER_PORT} == '80'">
#     RedirectMatch 302 ^/aleta/(?!api/|_next/|uploads/)(.*)$ http://192.168.10.10:8008/aleta/$1
# </If>
