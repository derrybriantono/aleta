services:
  postgres:
    container_name: aleta-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      TZ: Asia/Makassar
    volumes:
      # Pertahankan path database lama server jika mount produksi sudah berbeda.
      - /home/aleta-data/postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aleta} -d $${POSTGRES_DB:-aleta}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  portal:
    container_name: aleta-portal
    build:
      context: ./manajemen_surat
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_BASE_PATH: /aleta
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      TZ: Asia/Makassar
      NEXT_PUBLIC_BASE_PATH: /aleta
      BETTER_AUTH_URL: http://192.168.10.10/aleta
      ALETA_UPLOAD_DIR: /app/uploads
      ALETA_PDF_UPLOAD_DIR: /app/uploads/pdf
    # DNS untuk portal (jaringan bridge) - SENGAJA TIDAK ADA DI SINI.
    #
    # Sebelumnya berkas ini memuat:
    #
    #     dns:
    #       - ${ALETA_DNS_PRIMARY:-}
    #       - ${ALETA_DNS_SECONDARY:-}
    #
    # beserta keterangan bahwa "baris kosong dihapus sendiri oleh Compose
    # sehingga kunci dns ikut hilang". Keterangan itu TIDAK BENAR pada Compose
    # yang terpasang di server: kedua baris memuai menjadi dua tulisan kosong,
    # Docker menolaknya dengan "bad nameserver address", dan portal mati.
    # Sudah terjadi pada 6 September 2026 - portal padam sepuluh menit.
    #
    # Baris yang keberadaannya bergantung pada perilaku pemuaian tidak dapat
    # dipercaya. Kini DNS bersifat MASUK-BILA-DIMINTA lewat berkas terpisah:
    #
    #   docker compose -f docker-compose.yml -f docker-compose.override.yml \
    #     -f docker-compose.dns.yml up -d portal
    #
    # Tanpa berkas itu, container mewarisi DNS host - perilaku Docker bawaan,
    # dan yang benar untuk mayoritas satker.
    # Cari nilainya dengan: docker compose exec portal node scripts/diagnose-ai-dns.js
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/www/html/aleta-data/uploads:/app/uploads
      - /var/www/html/aleta-pdf:/app/uploads/pdf
      - /var/www/html/aleta-data/reports:/app/reports
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/aleta/api/public/institution').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      - postgres
      - aleta_bot

  aleta_bot:
    container_name: aleta-bot
    build:
      context: ./aleta_bot
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3003
      TZ: Asia/Makassar
      # Menunjuk ke folder yang terpasang di atas. Tanpa ini, bawaannya
      # jatuh ke home di dalam container - yang hilang tiap pembaruan.
      ALETA_ECOURT_SESSION_DIR: /usr/src/app/.ecourt-session
      # Kredensial e-Court tersandi BESERTA kunci penyandiannya.
      #
      # ecourtKredensialService jatuh ke os.homedir() bila peubah ini kosong,
      # yaitu /root/.aleta-ecourt-session di dalam container - tidak terpasang,
      # jadi hilang tiap pembaruan. Gejalanya: petugas diminta memasukkan sandi
      # e-Court lagi setiap kali versi baru dipasang, tanpa galat apa pun.
      # Sengaja disatukan dengan folder profil sesi, sebagaimana disebut
      # sendiri oleh keterangan fungsi folderSimpanan().
      ALETA_ECOURT_KREDENSIAL_DIR: /usr/src/app/.ecourt-session
      # Catatan cadangan (jsonl) yang ditulis ketika basis data bot mati.
      #
      # Bawaannya <app>/data - berada di lapisan container, sehingga jejak
      # pesan, kejadian keamanan, dan galat kueri musnah tiap pembaruan.
      # Yang hilang justru catatan dari saat basis datanya sedang bermasalah.
      # Ditaruh di dalam volume runtime-data yang sudah terpasang, supaya
      # tidak menuntut mount baru di server.
      ALETA_BOT_DATA_DIR: /usr/src/app/runtime-data/catatan
    command: sh -c "mkdir -p temp/resources/file/doc/ && node app.js"
    network_mode: "host"
    privileged: true
    volumes:
      - /var/www/html/aleta-data/wwebjs_auth:/usr/src/app/.wwebjs_auth
      # Profil peramban sesi e-Court.
      #
      # WAJIB terpasang keluar container. Tanpa ini, profilnya ikut hilang
      # setiap container dibuat ulang - yang terjadi pada SETIAP pembaruan -
      # dan petugas harus login ulang dengan captcha tiap kali dipasang versi
      # baru. Isinya kredensial sesi: folder ini jangan pernah disalin keluar
      # server, dan jangan ikut dicadangkan ke tempat yang lebih longgar
      # izinnya.
      - /var/www/html/aleta-data/ecourt-session:/usr/src/app/.ecourt-session
      - /var/www/html/aleta-data/reports:/usr/src/app/reports
      # Dokumen SIPP (petitum_dok/gugatan) agar bisa dilampirkan ke WhatsApp pihak.
      # WAJIB read-only (:ro) — bot hanya membaca, tidak pernah menulis ke SIPP.
      # Sesuaikan path kiri bila docroot SIPP satker berbeda; bila folder tidak ada,
      # bot otomatis jatuh ke ALETA_BOT_SIPP_DOCUMENT_BASE_URL (HTTP).
      - /var/www/html/SIPP:/usr/src/app/SIPP:ro
      # DUA PENGECUALIAN dari aturan hanya-baca di atas, dan hanya dua.
      #
      # Unggah putusan menulis naskahnya ke tempat yang SAMA dengan yang
      # dipakai SIPP sendiri: resources/file/doc untuk e-Doc, dan
      # resources/file/anonimisasi untuk salinan yang terbit di Direktori
      # Putusan. Tanpa mount ini keduanya gagal dengan "Read-only file system",
      # dan petugas melihat kalimat yang tidak dapat ia perbaiki sendiri.
      #
      # Sengaja dipersempit ke dua folder itu saja. Membuka seluruh pohon SIPP
      # untuk ditulis berarti satu kekeliruan kode dapat menyentuh basis
      # berkas perkara yang tidak ada hubungannya dengan putusan.
      #
      # Mount yang lebih dalam menang atas yang di atasnya, jadi urutannya
      # tidak menentukan - tetapi ditulis sesudahnya supaya terbaca sebagai
      # pengecualian, bukan sebagai aturan yang setara.
      - /var/www/html/SIPP/resources/file/doc:/usr/src/app/SIPP/resources/file/doc
      - /var/www/html/SIPP/resources/file/anonimisasi:/usr/src/app/SIPP/resources/file/anonimisasi
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
